# Provider (Alpaca) trade-condition code -> specification code, per tape (§4.6).
#
# The consolidated-last effect of each specification code is normative and lives in
# execution/trade_conditions.py (CTA CTS Pillar Output Specification v2.11b for tapes A/B; UTP Data
# Feed Services Specification v4.1 for tape C). This file only translates Alpaca's codes.
#
# EVERY ENTRY SHIPS `validated: false`. `expected_provider_name` is what the specification calls the
# code, not evidence of what Alpaca returns. Production, backtest and halt-reconstruction resolution
# refuse an unvalidated entry (reason `provider_mapping_unvalidated`). Nothing in this repository sets
# `validated`: the credentialed probe (`python -m ingest.condition_probe`) fetches
# /v2/stocks/meta/conditions/trade?tape=A|B|C, compares every returned tape/code/name with these
# entries, fails on any drift or unknown value, and only writes a PROPOSED file for the owner to
# review. Flipping `validated` is an owner commit.
