# Run-level settings (§6, §7, §9, §10.2, §11).
gate:
  k: 15                        # names passed per run; fixes the LLM budget
rebalance:
  weekday: monday              # decisions committed from the prior Friday close
  minutes_after_open: 30
  timezone: America/New_York
orders:
  limit_offset_bps: 10         # marketable limit at mid +/- 10 bps
  time_in_force_minutes: 15    # remainder converts to market
committee:
  logit_clip: [0.02, 0.98]
  cold_start_min_verdicts: 100
  weight_floor: 0.02           # w_floor: minimum pooling weight per voting agent (§7.1, owner-set)
  shrinkage:                   # §7.1: lambda_t = 0 until T_w, then 1 - exp(-(T - T_w) / tau)
    min_periods: 30            # T_w
    tau: 26
  overlap_weights:             # §7.1: 1 / overlap for weekly sampling; spec values, not 1/4.2, 1/12.6
    d5: 1.0
    d21: 0.25
    d63: 0.0769                # ~1/13
  stacker:                     # §7.2 ridge penalties: alpha -> logit(b), beta -> 1
    gamma_alpha: 1.0
    gamma_beta: 10.0
    activation_periods: 8      # T_s
horizons: [5, 21, 63]          # §3.1/§7.1 pool all three; §18.3: primary picked before P8
llm:
  temperature: 0
  max_retries: 3
  repair_attempts: 1
budgets:
  run_budget_usd: 10.0         # overridable with RUN_BUDGET_USD
# Freshness SLAs in wall-clock hours since the feed's last successful ingest (§4.1 cadence, §13).
# price_bars covers a weekend (Fri close -> Mon rebalance). Trading-calendar SLAs: P5.
freshness_sla_hours:
  price_bars: 72
  fundamentals: 36
  insider_trades: 36
  news: 1
# Beat cadence per feed (§4.1: bars EOD, XBRL and Form 4 daily, news 15 min). Each must be shorter
# than its SLA above, or a healthy feed could read stale. Each poll re-reads `lookback_days` back;
# inserts are idempotent, so overlap only guards against a missed poll.
ingest:
  cadence_minutes:
    price_bars: 1440
    fundamentals: 1440
    insider_trades: 1440
    news: 15
  lookback_days: 7
