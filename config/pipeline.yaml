# Run-level settings (§6, §7, §9, §10.2, §11).
gate:
  k: 15                        # names passed per run; fixes the LLM budget
rebalance:
  weekday: monday              # decisions committed from the prior Friday close
  minutes_after_open: 30
  timezone: America/New_York
orders:
  limit_offset_bps: 10         # marketable limit at mid +/- 10 bps
  time_in_force_minutes: 15    # remainder converts to market
committee:
  logit_clip: [0.02, 0.98]
  cold_start_min_verdicts: 100
  weight_floor: 0.02           # w_floor: minimum pooling weight per voting agent (§7.1, owner-set)
  shrinkage:                   # §7.1: lambda_t = 0 until T_w, then 1 - exp(-(T - T_w) / tau)
    min_periods: 30            # T_w
    tau: 26
  overlap_weights:             # §7.1: 1 / overlap for weekly sampling; spec values, not 1/4.2, 1/12.6
    d5: 1.0
    d21: 0.25
    d63: 0.0769                # ~1/13
  stacker:                     # §7.2 ridge penalties: alpha -> logit(b), beta -> 1
    gamma_alpha: 1.0
    gamma_beta: 10.0
    activation_periods: 8      # T_s
horizons: [5, 21, 63]          # §3.1/§7.1 pool all three; §18.3: primary picked before P8
llm:
  temperature: 0
  max_retries: 3
  repair_attempts: 1
budgets:
  run_budget_usd: 10.0         # overridable with RUN_BUDGET_USD
# Freshness SLAs in wall-clock hours since the feed's last successful ingest (§4.1 cadence, §13).
# price_bars covers a weekend (Fri close -> Mon rebalance). Trading-calendar SLAs: P5.
freshness_sla_hours:
  price_bars: 72
  fundamentals: 36
  insider_trades: 36
  news: 1
# Beat cadence per feed (§4.1: bars EOD, XBRL and Form 4 daily, news 15 min). Each must be shorter
# than its SLA above, or a healthy feed could read stale. Each poll re-reads `lookback_days` back;
# inserts are idempotent, so overlap only guards against a missed poll.
ingest:
  cadence_minutes:
    price_bars: 1440
    fundamentals: 1440
    insider_trades: 1440
    news: 15
  lookback_days: 7

# P6.3 market-data jobs (calendar, benchmark bars, DGS3MO, reference capture). These are NOT
# freshness_sla_hours feeds: nothing here can become a stale-feed kill-switch trigger.
reference_data:
  cadence_minutes:
    calendar: 1440
    benchmarks: 1440
    dgs3mo: 1440
    references: 5      # polls for runs whose D0 open + delay has arrived
    halt_sweep: 5      # resolves pending halt-reference requests
    corporate_actions: 1440  # P6.4 action poll + per-security coverage (never an SLA feed)
    listing_status: 1440     # P6.4 Alpaca asset status + Form 25 for inactive issuers
    delistings: 1440         # P6.4 evidence-hierarchy derivation
  # Operational timeout only (never infers D0 or open/closed): wait this long after a run's
  # commitment for calendar coverage before persisting `calendar_uncovered`.
  calendar_coverage_wait_minutes: 4320
  live_capture_grace_minutes: 10
  halt_live_grace_minutes: 5
  calendar_forward_days: 120
  calendar_back_days: 800
  corporate_actions_lookback_days: 30
  corporate_actions_batch_size: 50
  delisting_gap_sessions: 10
